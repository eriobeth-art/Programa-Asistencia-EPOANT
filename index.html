<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12385b">
  <title>Sistema de Asistencia · EPOANT</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4f9}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font:600 15px Arial,sans-serif;color:#173b5e;background:#eef4f9;z-index:2}
  </style>
</head>
<body>
  <div id="loading">Cargando Sistema de Asistencia EPOANT…</div>
  <iframe
    id="app"
    title="Sistema de Asistencia EPOANT"
    src="https://script.google.com/macros/s/AKfycbwhSxb01ovGGSy86Z_rA3lZZH0yqljZrWZeiRvHXkb8zldU2wKviJbBOk7bPc0sy-A/exec?embed=1&v=5.7.1-nc1"
    allow="camera; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      document.getElementById('loading').style.display='none';
    });
    setTimeout(()=>{
      document.getElementById('loading').style.display='none';
    },12000);
  </script>
</body>
</html>
